name: Refresh parliamentary corpus
on:
  workflow_dispatch:
    inputs:
      expand:
        description: 'Questions absentes du corpus à ajouter, des plus récentes aux plus anciennes (0 = actualiser seulement, 500 au plus)'
        default: '300'
        required: true
      legislature:
        description: 'Législature à collecter, comme dans le nom de l’index (24-29 = en cours ; 19-24 = précédente). Les fiches des autres législatures sont conservées telles quelles.'
        default: '24-29'
        required: true
      title_filter:
        description: 'Facultatif : n’ajouter que les questions dont le titre correspond (ex. Schaerbeek|Schaarbeek|Meiser|Josaphat)'
        default: ''
        required: false
  schedule:
    - cron: '20 4 * * 1'
permissions:
  contents: read
concurrency:
  group: parliamentary-corpus
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.CORPUS_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    env:
      # Contents are stored once (migration 005): a rollback version only costs
      # the questions that changed. Embedding caps fit about 400 new questions.
      IMPORT_MAX_RECORDS: '6000'
      IMPORT_KEEP_VERSIONS: '2'
      IMPORT_MAX_EMBEDDING_CALLS: '100'
      IMPORT_MAX_EMBEDDING_BYTES: '3000000'
      EMBEDDING_MODEL: text-embedding-3-small
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Export current corpus to preserve previously added documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run export:data
      - name: Collect public documents
        env:
          # Scheduled runs have no inputs: they add CORPUS_WEEKLY_ADD questions (300 by default).
          EXPAND: ${{ inputs.expand || vars.CORPUS_WEEKLY_ADD || '300' }}
          # Scheduled runs always refresh the current legislature, without title filter.
          LEGISLATURE: ${{ inputs.legislature || '24-29' }}
          TITLE_FILTER: ${{ inputs.title_filter || '' }}
        run: >-
          python scripts/refresh-corpus.py --file data/corpus-active.json --expand "$EXPAND"
          --max-records 6000 --max-downloads 900 --legislature "$LEGISLATURE" --title-filter "$TITLE_FILTER"
      - run: npm run import:data -- --file=data/corpus-refreshed.json --validate-only
      - name: Import and atomically activate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run import:data -- --file=data/corpus-refreshed.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-corpus-snapshot
          path: |
            web/data/corpus-refreshed.json
            web/data/source-snapshots/
          retention-days: 30
