name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    # Local corpus, no AI: the checks never reach Supabase or OpenAI (no cost).
    env:
      AI_ENABLED: ""
      SUPABASE_URL: ""
      SUPABASE_SECRET_KEY: ""
      OPENAI_API_KEY: ""
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: python3 scripts/test-collector.py
      - run: npm run import:data -- --validate-only
      - name: Search cases (data/corpus-refreshed.json, local search)
        run: npm run audit:search
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (production build, local corpus, AI disabled)
        env:
          APP_ORIGIN: http://127.0.0.1:3000
        run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Migrations and SQL tests on a throwaway pgvector database, never Supabase:
  # the migrations apply in order, 008 and 010 do what they claim, and 010
  # refuses to apply without 009. See web/supabase/tests/run.sh.
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v6
      - run: web/supabase/tests/run.sh
